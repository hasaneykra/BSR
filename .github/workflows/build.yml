name: Build BSR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/prepare_platform.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
          --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
          --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
          --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: bsr-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK as a release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk BSR.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BSR.apk --title "BSR (latest build)" --notes "Auto-built from ${GITHUB_SHA::7}. Push notifications are off in this build (no Firebase config)."
